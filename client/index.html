<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホームページ制作ヒアリング</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ed;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;line-height:1.65}.wrap{max-width:940px;margin:auto;padding:36px 18px 72px}.hero{margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#9a7b37;font-weight:800}.hero h1{font-size:34px;margin:8px 0}.hero p{color:#666;margin:0}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0}.progress div{padding:10px;border-radius:999px;background:#e9e5dc;text-align:center;font-size:12px;font-weight:700}.progress .active{background:#171717;color:#fff}.card{background:#fff;border:1px solid #e6e0d4;border-radius:20px;padding:30px;box-shadow:0 14px 40px rgba(0,0,0,.05)}.step{display:none}.step.active{display:block}.step h2{font-size:22px;margin:0 0 6px}.sub{color:#777;font-size:13px;margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:17px}.full{grid-column:1/-1}label{font-weight:750;font-size:14px}input,textarea,select{width:100%;border:1px solid #d7d0c2;border-radius:11px;padding:13px 14px;font:inherit;background:#fff}textarea{min-height:105px}.hint{font-size:12px;color:#818181}.req{color:#a26032}.nav{display:flex;gap:10px;margin-top:24px}.nav button{border:0;border-radius:11px;padding:14px 18px;font-weight:750;font-size:15px;cursor:pointer}.primary{background:#171717;color:#fff;flex:1}.secondary{background:#ece8df}.optional{background:#faf9f6;border:1px dashed #ddd5c7;padding:16px;border-radius:12px;margin-bottom:16px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.checks label{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #e5dfd3;border-radius:10px;font-weight:600}.checks input{width:auto}.complete{display:none;text-align:center;padding:28px}.complete.show{display:block}.status{display:none}.status.err{display:block;background:#fff0f0;padding:12px;border-radius:10px}.hp{position:absolute;left:-9999px}.colorRow{display:grid;grid-template-columns:110px 1fr;gap:10px}@media(max-width:700px){.grid,.checks{grid-template-columns:1fr}.card{padding:20px}.hero h1{font-size:28px}.progress div{font-size:10px;padding:8px 3px}.nav{flex-direction:column-reverse}}
</style></head><body><main class="wrap"><div class="hero"><div class="eyebrow">WEBSITE PROJECT INTAKE</div><h1>ホームページ制作ヒアリング</h1><p>内容だけでなく、HPの雰囲気と構成まで指定できます。</p></div><div class="progress" id="progress"><div class="active">1 基本情報</div><div>2 サイト内容</div><div>3 店舗情報</div><div>4 デザイン</div></div><div class="card"><form id="intakeForm">
<section class="step active"><h2>基本情報</h2><p class="sub">会社・店舗について教えてください。</p><div class="grid"><div class="field"><label>会社名・屋号 *</label><input name="brand" required></div><div class="field"><label>業種 *</label><input name="industry" required placeholder="例：パーソナルジム"></div><div class="field"><label>担当者名 *</label><input name="contactName" required></div><div class="field"><label>連絡用メール *</label><input name="contactEmail" type="email" required></div><div class="field full"><label>希望URL用ID *</label><input name="slug" pattern="[a-z0-9-]+" required placeholder="例：sample-gym-kitasenju"></div></div><div class="nav"><button class="primary next" type="button">次へ</button></div></section>
<section class="step"><h2>サイトの内容</h2><p class="sub">HPへ掲載する内容です。</p><div class="field"><label>ページタイトル *</label><input name="title" required></div><div class="field"><label>メインキャッチコピー *</label><textarea name="headline" required></textarea></div><div class="field"><label>メイン説明文 *</label><textarea name="description" required></textarea></div><div class="field"><label>強み *</label><textarea name="features" required placeholder="タイトル | 説明"></textarea></div><div class="field"><label>料金 *</label><textarea name="prices" required placeholder="プラン | 価格 | 補足"></textarea></div><div class="field"><label>口コミ</label><textarea name="reviews" placeholder="属性 | 内容"></textarea></div><div class="field"><label>実績・Before/After</label><textarea name="results" placeholder="タイトル | 内容"></textarea></div><div class="field"><label>FAQ</label><textarea name="faq" placeholder="質問 | 回答"></textarea></div><div class="nav"><button class="secondary prev" type="button">戻る</button><button class="primary next" type="button">次へ</button></div></section>
<section class="step"><h2>店舗・お問い合わせ情報</h2><div class="grid"><div class="field full"><label>住所</label><input name="address"></div><div class="field"><label>営業時間</label><input name="hours"></div><div class="field"><label>電話番号</label><input name="phone"></div><div class="field"><label>LINE URL</label><input name="lineUrl" type="url"></div><div class="field"><label>掲載用メール</label><input name="publicEmail" type="email"></div><div class="field full"><label>GoogleマップURL</label><input name="mapUrl" type="url"></div><div class="field"><label>Instagram</label><input name="instagram" type="url"></div><div class="field"><label>X</label><input name="xUrl" type="url"></div><div class="field"><label>TikTok</label><input name="tiktok" type="url"></div><div class="field"><label>YouTube</label><input name="youtube" type="url"></div></div><div class="nav"><button class="secondary prev" type="button">戻る</button><button class="primary next" type="button">次へ</button></div></section>
<section class="step"><h2>デザイン・構成</h2><p class="sub">ここで案件ごとのHPの形を変えられます。</p><div class="grid"><div class="field"><label>デザインタイプ</label><select name="designPreset"><option value="luxury">Luxury｜高級感</option><option value="minimal">Minimal｜シンプル</option><option value="friendly">Friendly｜親しみやすい</option><option value="bold">Bold｜力強い</option><option value="photo">Photo First｜写真重視</option></select></div><div class="field"><label>ページ構成</label><select name="structurePreset"><option value="standard">Standard｜標準</option><option value="conversion">Conversion｜料金・CTA重視</option><option value="story">Story｜コンセプト・紹介重視</option><option value="proof">Proof｜実績・口コミ重視</option></select></div></div><div class="optional"><label>表示しないセクション</label><div class="checks"><label><input type="checkbox" name="hideResults">実績</label><label><input type="checkbox" name="hideReviews">口コミ</label><label><input type="checkbox" name="hideAbout">紹介</label><label><input type="checkbox" name="hideAccess">店舗情報</label><label><input type="checkbox" name="hideFaq">FAQ</label><label><input type="checkbox" name="hideConcept">コンセプト</label></div></div><div class="field"><label>希望カラー</label><div class="colorRow"><input name="color" type="color" value="#171717"><input name="colorNote" placeholder="例：黒×ゴールド"></div></div><div class="field"><label>参考サイトURL</label><textarea name="referenceUrls" placeholder="1行につき1URL"></textarea></div><div class="field"><label>特に寄せたいポイント</label><textarea name="designNotes" placeholder="例：ファーストビューは写真を大きく、料金を上の方に、余白多め"></textarea></div><div class="field"><label>ロゴURL</label><input name="logoUrl" type="url"></div><div class="field"><label>写真URL</label><textarea name="photoUrls" placeholder="1行につき1URL"></textarea></div><div class="optional"><div class="field"><label>Google Search Console確認コード</label><input name="googleVerification"><span class="hint">未取得なら空欄でOK</span></div></div><div class="field"><label>その他の要望</label><textarea name="notes"></textarea></div><div class="optional"><div class="field"><label>フォームアクセスコード *</label><input name="accessCode" type="password" required></div></div><div class="hp"><input name="website" tabindex="-1"></div><div class="nav"><button class="secondary prev" type="button">戻る</button><button id="submitBtn" class="primary" type="submit">内容を送信する</button></div><div id="status" class="status"></div></section></form><div id="complete" class="complete"><h2>フォーム送信ありがとうございます。</h2><p>内容を確認のうえ、初稿制作を進めさせていただきます。<br>必要に応じて追加でご連絡させていただく場合がございます。</p></div></div></main><script>
const form=document.getElementById('intakeForm'),steps=[...document.querySelectorAll('.step')],prog=[...document.querySelectorAll('#progress div')],status=document.getElementById('status'),btn=document.getElementById('submitBtn');let current=0;function show(n){current=n;steps.forEach((s,i)=>s.classList.toggle('active',i===n));prog.forEach((p,i)=>p.classList.toggle('active',i===n));scrollTo({top:0,behavior:'smooth'})}function valid(){for(const f of steps[current].querySelectorAll('[required]'))if(!f.checkValidity()){f.reportValidity();return false}return true}document.querySelectorAll('.next').forEach(b=>b.onclick=()=>valid()&&show(current+1));document.querySelectorAll('.prev').forEach(b=>b.onclick=()=>show(current-1));form.onsubmit=async e=>{e.preventDefault();if(!valid())return;btn.disabled=true;const fd=new FormData(form),data=Object.fromEntries(fd.entries());for(const n of ['hideResults','hideReviews','hideAbout','hideAccess','hideFaq','hideConcept'])data[n]=fd.has(n);try{const q=new URLSearchParams(location.search),share=q.get('_vercel_share'),api=share?`/api/new-site?_vercel_share=${encodeURIComponent(share)}`:'/api/new-site';const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'送信に失敗しました');form.style.display='none';document.getElementById('progress').style.display='none';document.getElementById('complete').classList.add('show')}catch(err){status.className='status err';status.textContent=err.message}finally{btn.disabled=false}};
</script></body></html>
