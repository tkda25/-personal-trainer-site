<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HP設定ジェネレーター</title><link rel="stylesheet" href="style.css"><style>body{background:#f7f6f2}.generator{max-width:980px;margin:0 auto;padding:40px 20px}.generator h1{font-size:34px}.panel{background:#fff;border:1px solid #e7e1d3;padding:24px;margin:18px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields label{font-size:12px;color:#555}.fields input,.fields textarea,.fields select{width:100%;padding:12px;border:1px solid #ccc;margin-top:6px;font:inherit}.full{grid-column:1/-1}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions button{border:0;padding:12px 18px;cursor:pointer}.primary{background:#ad9151;color:#fff}.secondary{background:#222;color:#fff}pre{white-space:pre-wrap;word-break:break-word;background:#171717;color:#f4f4f4;padding:18px;max-height:520px;overflow:auto;font-size:12px}@media(max-width:700px){.fields{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="generator"><small>WEBSITE AUTOMATION</small><h1>HP設定ジェネレーター</h1><p>クライアント情報を入力すると、サイト本体で使える <code>site.config.js</code> を自動生成します。</p><section class="panel"><div class="fields"><label>業種<select id="industry"><option>パーソナルジム</option><option>整体</option><option>美容室</option><option>ネイル</option><option>エステ</option><option>飲食店</option><option>士業</option><option>スクール</option><option>その他</option></select></label><label>ブランド名<input id="brand" placeholder="例：TK"></label><label class="full">正式名称<input id="title" placeholder="例：TK PERSONAL TRAINING"></label><label>英字カテゴリー<input id="eyebrow" placeholder="例：PERSONAL TRAINING"></label><label>CTAボタン文言<input id="ctaLabel" value="LINEで相談する"></label><label class="full">キャッチコピー<input id="headline" placeholder="例：理想の身体を、あなたらしく。"></label><label class="full">説明文<textarea id="description" rows="3" placeholder="サービスの説明"></textarea></label><label>LINE URL<input id="lineUrl" placeholder="https://lin.ee/..."></label><label>メール<input id="email" type="email" placeholder="info@example.com"></label><label class="full">コンセプト見出し<input id="conceptHeadline" placeholder="例：続けられるから、身体は変わっていく。"></label><label class="full">コンセプト本文<textarea id="conceptBody" rows="3"></textarea></label><label class="full">強み（1行1項目、タイトル｜説明）<textarea id="features" rows="5" placeholder="完全個別対応｜一人ひとりに合わせて提案します。"></textarea></label><label class="full">料金（1行1項目、プラン｜価格｜補足）<textarea id="prices" rows="5" placeholder="体験プラン｜5,000円（税込）｜カウンセリング込み"></textarea></label><label class="full">FAQ（1行1項目、質問｜回答）<textarea id="faqs" rows="5"></textarea></label></div><div class="actions"><button class="primary" id="generate">設定ファイルを生成</button><button class="secondary" id="copy">コピー</button><button id="download">site.config.js を保存</button></div></section><section class="panel"><h2>生成結果</h2><pre id="output">ここに site.config.js が生成されます。</pre></section></main><script src="generator.js"></script></body></html>
